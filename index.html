<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16242C">
<title>Deal Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16242C; --ink-2:#4A5C66; --ink-3:#7E8D95;
  --surface:#F4F6F7; --panel:#FFFFFF; --rule:#DCE3E6; --rule-2:#EDF1F2;
  --gain:#0D6A4E; --owed:#8A5B08; --late:#A32B1F; --act:#1D5F73;
  --gain-bg:#E8F2EE; --owed-bg:#F7F0DF; --late-bg:#F8E9E7; --act-bg:#E7EFF2;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:Archivo,'Helvetica Neue',Arial,sans-serif;
  background:var(--surface); color:var(--ink);
  font-size:15px; line-height:1.45;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  padding-bottom:64px;
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}

/* ---------- masthead + ledger strip ---------- */
header{background:var(--ink);color:#fff;padding:14px 0 0}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mast h1{font-size:16px;font-weight:600;letter-spacing:-.01em}
.mast button{
  background:none;border:1px solid rgba(255,255,255,.28);color:#fff;
  font:inherit;font-size:13px;padding:4px 10px;border-radius:3px;cursor:pointer;
}
.mast button:hover{border-color:rgba(255,255,255,.6)}
.ledger{display:flex;margin-top:12px;border-top:1px solid rgba(255,255,255,.14)}
.ledger div{
  flex:1;padding:11px 10px 13px;border-right:1px solid rgba(255,255,255,.14);
  cursor:pointer;background:none;border-top:0;border-bottom:0;border-left:0;
  color:inherit;font:inherit;text-align:left;
}
.ledger div:last-child{border-right:0}
.ledger div:hover{background:rgba(255,255,255,.06)}
.ledger .v{font-size:21px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.ledger .k{font-size:11.5px;color:rgba(255,255,255,.62);margin-top:3px}
.ledger .v.flag{color:#F5B1A6}

/* ---------- entry form ---------- */
.new{margin-top:16px}
.newbtn{
  width:100%;background:var(--ink);color:#fff;border:0;border-radius:4px;
  font:inherit;font-size:15px;font-weight:600;padding:13px;cursor:pointer;
}
.newbtn:hover{background:#1F343E}
.form{
  background:var(--panel);border:1px solid var(--rule);border-radius:4px;
  padding:16px;margin-top:0;
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 12px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
input,select,textarea{
  width:100%;font:inherit;font-size:15px;color:var(--ink);background:#fff;
  border:1px solid var(--rule);border-radius:3px;padding:8px 9px;
  font-variant-numeric:tabular-nums;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--act);outline-offset:-1px;border-color:var(--act)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:3px}

.readout{
  grid-column:1/-1;background:var(--ink);color:#fff;border-radius:4px;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.readout .big{font-size:33px;font-weight:700;letter-spacing:-.025em;line-height:1}
.readout .lab{font-size:13px;color:rgba(255,255,255,.7);margin-top:4px}
.readout .side{text-align:right;font-size:12.5px;color:rgba(255,255,255,.72);line-height:1.7}
.readout .side b{color:#fff;font-weight:600}
.readout.idle .big{color:rgba(255,255,255,.3)}

.row-btns{display:flex;gap:9px;margin-top:14px}
button.primary{
  background:var(--act);color:#fff;border:0;border-radius:3px;font:inherit;
  font-weight:600;padding:10px 18px;cursor:pointer;
}
button.primary:hover{background:#174F60}
button.ghost{
  background:#fff;color:var(--ink-2);border:1px solid var(--rule);border-radius:3px;
  font:inherit;padding:10px 16px;cursor:pointer;
}
button.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
button.link{background:none;border:0;color:var(--act);font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline}
button:disabled{opacity:.45;cursor:default}

/* ---------- tabs ---------- */
nav{display:flex;gap:2px;margin:20px 0 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{
  background:none;border:0;border-bottom:2px solid transparent;font:inherit;font-size:14px;
  color:var(--ink-2);padding:8px 11px;cursor:pointer;white-space:nowrap;
}
nav button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
nav .ct{font-size:11.5px;color:var(--ink-3);margin-left:4px}

/* ---------- deal rows ---------- */
.list{background:var(--panel);border:1px solid var(--rule);border-radius:4px;margin-top:10px;overflow:hidden}
.deal{border-bottom:1px solid var(--rule-2)}
.deal:last-child{border-bottom:0}
.head{
  display:flex;align-items:stretch;gap:0;width:100%;background:none;border:0;
  font:inherit;text-align:left;cursor:pointer;color:inherit;
}
.head:hover{background:#FAFCFC}
.spine{width:4px;flex:0 0 4px;background:var(--rule)}
.spine.due{background:var(--late)}
.spine.owed{background:var(--owed)}
.spine.ready{background:var(--act)}
.spine.sold{background:var(--gain)}
.body{flex:1;padding:12px 13px;min-width:0}
.title{font-weight:600;font-size:15px;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.meta .sep{color:var(--rule);margin:0 5px}
.meta .due{color:var(--late);font-weight:600}
.meta .soon{color:var(--owed);font-weight:500}
.figs{padding:12px 13px 12px 0;text-align:right;flex:0 0 auto}
.figs .a{font-size:16px;font-weight:600;letter-spacing:-.01em}
.figs .a.pos{color:var(--gain)}
.figs .a.neg{color:var(--late)}
.figs .b{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.detail{padding:2px 13px 16px 17px;background:#FBFCFC;border-top:1px solid var(--rule-2)}
.sect{margin-top:15px}
.sect > h3{
  font-size:13px;font-weight:600;color:var(--ink);margin-bottom:9px;
  padding-bottom:5px;border-bottom:1px solid var(--rule);
}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 11px}
.mini label{font-size:11.5px}
.mini input,.mini select{padding:6px 8px;font-size:14px}
.facts{font-size:13px;color:var(--ink-2);line-height:1.85;margin-top:9px}
.facts b{color:var(--ink);font-weight:600}
.warn{color:var(--late);font-weight:600}
.pill{
  display:inline-block;font-size:12px;padding:2px 8px;border-radius:3px;
  background:var(--owed-bg);color:var(--owed);font-weight:600;
}
.pill.late{background:var(--late-bg);color:var(--late)}
.pill.ok{background:var(--gain-bg);color:var(--gain)}
.empty{padding:34px 18px;text-align:center;color:var(--ink-2);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:15px;margin-bottom:4px}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:16px;margin-top:22px}
.panel > h2{font-size:15px;font-weight:600;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12px;padding:0 8px 6px 0;border-bottom:1px solid var(--rule)}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--rule-2)}
td.r,th.r{text-align:right;padding-right:0}
tr:last-child td{border-bottom:0}
.tot{font-weight:600}
.owedbal{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:2px 0 2px}
.owedbal.zero{color:var(--ink-3)}
.owedbal.due{color:var(--owed)}
.sub{font-size:12.5px;color:var(--ink-2)}
.pay{display:flex;gap:8px;align-items:flex-end;margin-top:13px;flex-wrap:wrap}
.pay > div{flex:1;min-width:110px}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:11px;padding-top:11px;border-top:1px solid var(--rule-2)}
.banner{
  background:var(--late-bg);border:1px solid #E8C4BE;color:#7A2016;
  border-radius:4px;padding:10px 12px;font-size:13px;margin-top:14px;
}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:50;
  max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:12px;color:var(--ink-3);margin:26px 0 10px}

@media (max-width:620px){
  .grid{grid-template-columns:1fr}
  .grid .half{grid-column:auto}
  .mini{grid-template-columns:repeat(2,1fr)}
  .ledger{flex-wrap:wrap}
  .ledger div{flex:1 1 50%;border-bottom:1px solid rgba(255,255,255,.14)}
  .ledger div:nth-child(2){border-right:0}
  .readout{flex-direction:column;align-items:flex-start;gap:10px}
  .readout .side{text-align:left}
  .figs .a{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--act);outline-offset:1px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="mast">
      <h1>Deal Desk</h1>
      <button id="btnData">Data &amp; settings</button>
    </div>
    <div class="ledger" id="ledger"></div>
  </div>
</header>

<div class="wrap">
  <div id="storageWarn"></div>

  <div class="new">
    <button class="newbtn" id="btnNew">Add a deal</button>
    <div class="form" id="form" hidden></div>
  </div>

  <nav id="tabs" role="tablist"></nav>
  <div class="list" id="list"></div>

  <div class="panel" id="maaser"></div>
  <div class="panel" id="settings" hidden></div>

  <footer>Everything is stored on this device. Back it up from Data &amp; settings.</footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ======================= storage ======================= */
var KEY = 'dealdesk.v1';
var memFallback = null;

function readStore(){
  if (memFallback) return memFallback;
  try {
    var raw = window.localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    memFallback = memFallback || blank();
    return memFallback;
  }
}
function writeStore(s){
  if (memFallback) { memFallback = s; return false; }
  try { window.localStorage.setItem(KEY, JSON.stringify(s)); return true; }
  catch (e) { memFallback = s; showStorageWarning(); return false; }
}
function blank(){
  return {
    deals: [],
    payments: [],
    settings: {
      maaserRate: 0.10,
      reviewWindow: 7,
      pointsPct: 0.06,
      feePct: 0,
      pointsAsIncome: false,
      sheetUrl: ''
    }
  };
}

var S = readStore() || blank();
if (!S.settings) S.settings = blank().settings;
if (!S.payments) S.payments = [];
if (!S.deals) S.deals = [];

function save(){ writeStore(S); }

function showStorageWarning(){
  var el = document.getElementById('storageWarn');
  if (el.dataset.shown) return;
  el.dataset.shown = '1';
  el.innerHTML = '<div class="banner">This browser is blocking local storage, so your entries '
    + 'will vanish when you close the tab. Export a backup from Data &amp; settings before you go, '
    + 'or open this page from its own address rather than a preview.</div>';
}
if (memFallback) showStorageWarning();

/* ======================= helpers ======================= */
function money(v){
  if (v === null || v === undefined || isNaN(v)) return '—';
  var n = Number(v), sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function money0(v){
  if (v === null || v === undefined || isNaN(v)) return '—';
  var n = Number(v), sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function pct(v){ return (Number(v) * 100).toFixed(Number(v)*100 % 1 ? 1 : 0) + '%'; }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : null; }
function esc(t){
  return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function today(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseDate(s){
  if (!s) return null;
  var p = String(s).split('-');
  if (p.length !== 3) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d.getTime()) ? null : d;
}
function iso(d){
  if (!d) return '';
  var m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + day;
}
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function dayDiff(a, b){ return Math.round((a - b) / 86400000); }
function fmtShort(d){
  if (!d) return '';
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function uid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

/* ======================= the math =======================
   Mirrors the spreadsheet exactly:
     netCost   = (price + tax) - refund - taxReimbursed - points
     breakeven = netCost / (1 - feePct)
     profit    = salePrice - fees - netCost
   Expected amounts are used until actual ones are entered.
========================================================= */
function calc(d){
  var price = num(d.price) || 0;
  var tax   = num(d.tax) || 0;
  var charged = price + tax;

  /* Two ways a deal can be written:
       percent — they send back a share of the price
       flat    — they send back everything above a fixed amount you keep paying
     With a flat deal the fixed amount can be measured against the price alone
     or against the whole charge including tax, and that changes the answer. */
  var refundExp, taxExp;
  if (d.refundMode === 'flat') {
    var keep = num(d.flatCost) || 0;
    if (d.flatBase === 'charged') {
      refundExp = Math.max(0, charged - keep);   // tax is folded into the one refund
      taxExp = 0;
    } else {
      refundExp = Math.max(0, price - keep);
      taxExp = d.taxRefunded ? tax : 0;
    }
  } else {
    refundExp = price * (num(d.refundPct) || 0);
    taxExp = d.taxRefunded ? tax : 0;
  }
  var effPct = price > 0 ? refundExp / price : 0;

  var refundAct = num(d.refundGot);
  var refund = (refundAct === null) ? refundExp : refundAct;

  var taxAct = num(d.taxGot);
  var taxIn = (taxAct === null) ? taxExp : taxAct;

  var pointsPct = (num(d.pointsPct) === null) ? S.settings.pointsPct : num(d.pointsPct);
  var points = charged * pointsPct;

  var feePct = (num(d.feePct) === null) ? S.settings.feePct : num(d.feePct);

  var netCost = charged - refund - taxIn - points;
  var breakeven = netCost / (1 - feePct);

  var owed = 0;
  if (refundExp > 0 && refundAct === null) owed += refundExp;
  if (taxExp > 0 && taxAct === null) owed += taxExp;

  var settled = (refundExp <= 0 || refundAct !== null) && (taxExp <= 0 || taxAct !== null);
  var shortfall = null;
  if (refundAct !== null || taxAct !== null) {
    shortfall = (refundExp + taxExp) - ((refundAct || 0) + (taxAct || 0));
    if (Math.abs(shortfall) < 0.005) shortfall = 0;
  }

  var sale = num(d.salePrice);
  var fees = sale === null ? null : sale * feePct;
  var profit = sale === null ? null : sale - fees - netCost;

  var arrival = parseDate(d.arrivalDate);
  var eligible = arrival ? addDays(arrival, S.settings.reviewWindow) : null;
  var needsReview = d.reviewType && d.reviewType !== 'None' && !d.reviewDone;
  var daysTilEligible = eligible ? dayDiff(eligible, today()) : null;
  var reviewDue = needsReview && eligible && daysTilEligible <= 0;

  return {
    charged:charged, refundExp:refundExp, refund:refund, taxExp:taxExp, taxIn:taxIn,
    effPct:effPct,
    points:points, pointsPct:pointsPct, feePct:feePct, netCost:netCost, breakeven:breakeven,
    owed:owed, settled:settled, shortfall:shortfall,
    sale:sale, fees:fees, profit:profit,
    eligible:eligible, needsReview:needsReview, reviewDue:reviewDue,
    daysTilEligible:daysTilEligible, sold:sale !== null
  };
}

function state(d){
  var c = calc(d);
  if (c.sold) return 'sold';
  if (d.dead) return 'dead';
  if (c.reviewDue) return 'due';
  if (c.owed > 0) return 'owed';
  if (c.settled && !d.listed) return 'ready';
  return 'open';
}

/* ---- maaser: cumulative over sold deals, in sale-date order ---- */
function maaserPicture(){
  var sold = S.deals.filter(function(d){ return calc(d).sold; })
    .sort(function(a,b){ return (a.saleDate||'').localeCompare(b.saleDate||''); });
  var netProfit = 0, gross = 0, fees = 0, basis = 0;
  sold.forEach(function(d){
    var c = calc(d);
    netProfit += c.profit; gross += c.sale; fees += c.fees; basis += c.netCost;
  });
  var pointsAdj = 0;
  if (S.settings.pointsAsIncome) {
    S.deals.forEach(function(d){
      var c = calc(d);
      if (!c.sold) pointsAdj += c.points;
    });
  }
  var base = netProfit + pointsAdj;
  var due = Math.max(0, base) * S.settings.maaserRate;
  var paid = S.payments.reduce(function(t,p){ return t + (num(p.amount)||0); }, 0);
  return {
    sold:sold.length, gross:gross, fees:fees, basis:basis, netProfit:netProfit,
    pointsAdj:pointsAdj, base:base, due:due, paid:paid, balance:due - paid
  };
}

function totals(){
  var owed = 0, dueCt = 0, soonCt = 0, onHand = 0, tiedUp = 0, needBreak = 0, shortTotal = 0;
  S.deals.forEach(function(d){
    var c = calc(d);
    owed += c.owed;
    if (c.reviewDue) dueCt++;
    else if (c.needsReview && c.daysTilEligible !== null && c.daysTilEligible > 0) soonCt++;
    if (!c.sold && !d.dead) { onHand++; tiedUp += c.netCost; needBreak += c.breakeven; }
    if (c.shortfall && c.shortfall > 0) shortTotal += c.shortfall;
  });
  return { owed:owed, dueCt:dueCt, soonCt:soonCt, onHand:onHand,
           tiedUp:tiedUp, needBreak:needBreak, shortTotal:shortTotal };
}

/* ======================= entry form ======================= */
var formOpen = false, editingId = null;

function formHTML(d){
  d = d || {};
  var s = S.settings;
  var mode = d.refundMode === 'flat'
    ? (d.flatBase === 'charged' ? 'flat-charged' : 'flat-price')
    : 'percent';
  return ''
  + '<div class="grid">'
  + '  <div class="full"><label for="f-item">Item</label>'
  + '    <input id="f-item" type="text" placeholder="Bluetooth earbuds" value="'+esc(d.item||'')+'"></div>'
  + '  <div class="full"><label for="f-link">Amazon link</label>'
  + '    <input id="f-link" type="url" inputmode="url" placeholder="https://amazon.com/dp/..." value="'+esc(d.link||'')+'"></div>'
  + '  <div><label for="f-price">Price before tax</label>'
  + '    <input id="f-price" type="number" step="0.01" inputmode="decimal" placeholder="100.00" value="'+esc(d.price==null?'':d.price)+'"></div>'
  + '  <div><label for="f-tax">Tax charged</label>'
  + '    <input id="f-tax" type="number" step="0.01" inputmode="decimal" placeholder="7.00" value="'+esc(d.tax==null?'':d.tax)+'"></div>'
  + '  <div class="full"><label for="f-mode">How the refund is written</label>'
  + '    <select id="f-mode">'
  + '      <option value="percent"'+(mode==='percent'?' selected':'')+'>A percentage of the price</option>'
  + '      <option value="flat-price"'+(mode==='flat-price'?' selected':'')+'>A fixed amount I keep paying, off the price</option>'
  + '      <option value="flat-charged"'+(mode==='flat-charged'?' selected':'')+'>A fixed amount I keep paying, off the whole charge</option>'
  + '    </select></div>'
  + '  <div id="wrap-refund"><label for="f-refund">Refund percentage</label>'
  + '    <input id="f-refund" type="number" step="1" inputmode="decimal" placeholder="85" value="'+esc(d.refundPct==null?'':Math.round(d.refundPct*1000)/10)+'">'
  + '    <div class="hint">Percent of the price before tax</div></div>'
  + '  <div id="wrap-flat"><label for="f-flat">What it costs you</label>'
  + '    <input id="f-flat" type="number" step="0.01" inputmode="decimal" placeholder="50.00" value="'+esc(d.flatCost==null?'':d.flatCost)+'">'
  + '    <div class="hint" id="flat-hint">They refund everything above this</div></div>'
  + '  <div id="wrap-taxref"><label for="f-taxref">Tax refunded too?</label>'
  + '    <select id="f-taxref">'
  + '      <option value="no"'+(d.taxRefunded?'':' selected')+'>No</option>'
  + '      <option value="yes"'+(d.taxRefunded?' selected':'')+'>Yes</option>'
  + '    </select></div>'

              return '<option'+((d.reviewType||'Text')===o?' selected':'')+'>'+o+'</option>'; }).join('')
  + '    </select></div>'
  + '  <div><label for="f-notes">Notes</label>'

function formValues(){
  var g = function(id){ var e = document.getElementById(id); return e ? e.value : ''; };
  var p = function(id){ var v = num(g(id)); return v === null ? null : v / 100; };
  var mode = g('f-mode') || 'percent';
  return {
    item: g('f-item').trim(),
    link: g('f-link').trim(),
    price: num(g('f-price')),
    tax: num(g('f-tax')) || 0,
    refundMode: mode === 'percent' ? 'percent' : 'flat',
    flatBase: mode === 'flat-charged' ? 'charged' : 'price',
    flatCost: num(g('f-flat')),
    refundPct: p('f-refund'),
    taxRefunded: mode === 'flat-charged' ? false : (g('f-taxref') === 'yes'),
    pointsPct: p('f-points'),
    feePct: p('f-fee'),
    orderDate: g('f-order'),
    arrivalDate: g('f-arrive'),
    reviewType: g('f-rtype'),
    notes: g('f-notes').trim()
  };
}

function syncFormMode(){
  var sel = document.getElementById('f-mode');
  if (!sel) return;
  var mode = sel.value;
  var flat = mode !== 'percent';
  document.getElementById('wrap-refund').hidden = flat;
  document.getElementById('wrap-flat').hidden = !flat;
  document.getElementById('wrap-taxref').hidden = (mode === 'flat-charged');
  var hint = document.getElementById('flat-hint');
  if (hint) {
    hint.textContent = mode === 'flat-charged'
      ? 'Your total out of pocket, tax included'
      : 'Your cost before tax. Tax is handled separately.';
  }
}

function paintReadout(){
  var el = document.getElementById('readout');
  if (!el) return;
  var v = formValues();
  var termsSet = v.refundMode === 'flat' ? v.flatCost !== null : v.refundPct !== null;
  if (v.price === null || v.price <= 0 || !termsSet) {
    el.classList.add('idle');
    el.innerHTML = '<div><div class="big">$0.00</div>'
      + '<div class="lab">Enter a price and the refund terms</div></div>';
    return;
  }
  var c = calc(v);
  el.classList.remove('idle');
  var headline = c.breakeven <= 0
    ? '<div><div class="big">Free money</div><div class="lab">They are paying you '
      + money(-c.breakeven) + ' to take it. Any sale is profit.</div></div>'
    : '<div><div class="big">' + money(c.breakeven) + '</div>'
      + '<div class="lab">Sell above this to profit</div></div>';
  el.innerHTML = headline
    + '<div class="side">'
    + 'Out of pocket <b>' + money(c.charged) + '</b><br>'
    + 'Coming back <b>' + money(c.refund + c.taxIn) + '</b><br>'
    + 'Card points <b>' + money(c.points) + '</b>'
    + '</div>';
}

function openForm(id){
  editingId = id || null;
  var d = id ? S.deals.find(function(x){ return x.id === id; }) : null;
  var f = document.getElementById('form');
  f.innerHTML = formHTML(d);
  f.hidden = false;
  formOpen = true;
  document.getElementById('btnNew').textContent = editingId ? 'Editing a deal' : 'Adding a deal';
  ['f-price','f-tax','f-refund','f-flat','f-taxref','f-points','f-fee'].forEach(function(id){
    var e = document.getElementById(id);
    if (e) { e.addEventListener('input', paintReadout); e.addEventListener('change', paintReadout); }
  });
  document.getElementById('f-mode').addEventListener('change', function(){
    syncFormMode(); paintReadout();
  });
  syncFormMode();
  document.getElementById('f-save').addEventListener('click', saveForm);
  document.getElementById('f-cancel').addEventListener('click', closeForm);
  paintReadout();
  var first = document.getElementById('f-item');
  if (first && !id) first.focus();
  f.scrollIntoView({ block:'nearest' });
}
function closeForm(){
  document.getElementById('form').hidden = true;
  document.getElementById('form').innerHTML = '';
  document.getElementById('btnNew').textContent = 'Add a deal';
  formOpen = false; editingId = null;
}
function saveForm(){
  var v = formValues();
  if (!v.item) { toast('Give the item a name.'); document.getElementById('f-item').focus(); return; }
  if (v.price === null || v.price <= 0) { toast('Enter the price you paid.'); document.getElementById('f-price').focus(); return; }
  if (v.refundMode === 'flat') {
    if (v.flatCost === null) { toast('Enter what the deal costs you.'); document.getElementById('f-flat').focus(); return; }
  } else if (v.refundPct === null) {
    toast('Enter the refund percentage.'); document.getElementById('f-refund').focus(); return;
  }

  if (editingId) {
    var d = S.deals.find(function(x){ return x.id === editingId; });
    Object.keys(v).forEach(function(k){ d[k] = v[k]; });
    toast('Changes saved.');
  } else {
    v.id = uid();
    v.reviewDone = false;
    v.reviewText = '';
    v.refundGot = null; v.taxGot = null;
    v.salePrice = null; v.saleDate = '';
    v.listed = false; v.dead = false;
    S.deals.unshift(v);
    toast('Deal added. Sell above ' + money(calc(v).breakeven) + '.');
  }
  save(); closeForm(); render();
}

/* ======================= list ======================= */
var TABS = [
  { k:'all',    label:'Everything', test:function(){ return true; } },
  { k:'review', label:'Reviews',    test:function(d){ var c = calc(d); return c.needsReview && !c.sold; } },
  { k:'owed',   label:'Owed money', test:function(d){ return calc(d).owed > 0; } },
  { k:'stock',  label:'In stock',   test:function(d){ var c = calc(d); return !c.sold && !d.dead; } },
  { k:'sold',   label:'Sold',       test:function(d){ return calc(d).sold; } }
];
var tab = 'all';
var openRows = {};

function rowMeta(d, c){
  var bits = [];
  if (c.sold) {
    bits.push('Sold ' + fmtShort(parseDate(d.saleDate)) + ' for ' + money(c.sale));
  } else if (c.reviewDue) {
    var od = -c.daysTilEligible;
    bits.push('<span class="due">' + d.reviewType + ' review due'
      + (od > 0 ? ' — ' + od + ' day' + (od === 1 ? '' : 's') + ' past' : ' today') + '</span>');
  } else if (c.needsReview && c.daysTilEligible !== null) {
    bits.push('<span class="soon">' + d.reviewType + ' review in '
      + c.daysTilEligible + ' day' + (c.daysTilEligible === 1 ? '' : 's') + '</span>');
  } else if (c.needsReview && !d.arrivalDate) {
    bits.push('<span class="soon">Set arrival to start the clock</span>');
  }
  if (c.owed > 0) bits.push(money(c.owed) + ' not collected');
  if (!c.sold && c.settled && !d.listed && !d.dead) bits.push('Ready to list');
  if (d.listed && !c.sold) bits.push('Listed');
  if (d.dead && !c.sold) bits.push('Written off');
  if (!bits.length) bits.push('Ordered ' + fmtShort(parseDate(d.orderDate)));
  return bits.join('<span class="sep">|</span>');
}

function listHTML(){
  var t = TABS.find(function(x){ return x.k === tab; });
  var rows = S.deals.filter(t.test);
  if (!rows.length) {
    var msgs = {
      all:   ['Nothing here yet', 'Add your first deal and the sell-above number appears straight away.'],
      review:['No reviews outstanding', 'Reviews show up here once you set an arrival date.'],
      owed:  ['Everything has been collected', 'Deals waiting on a refund land here.'],
      stock: ['No inventory', 'Items you have but have not sold will be listed here.'],
      sold:  ['No sales recorded', 'Enter a sale price on a deal and the profit shows here.']
    }[tab];
    return '<div class="empty"><b>' + msgs[0] + '</b>' + msgs[1] + '</div>';
  }
  return rows.map(function(d){
    var c = calc(d);
    var st = state(d);
    var fig, sub, cls = '';
    if (c.sold) {
      fig = money(c.profit); sub = 'profit'; cls = c.profit >= 0 ? 'pos' : 'neg';
    } else {
      fig = c.breakeven <= 0 ? 'Any price' : money(c.breakeven); sub = 'sell above';
    }
    var open = !!openRows[d.id];
    return '<div class="deal">'
      + '<button class="head" data-toggle="' + d.id + '" aria-expanded="' + open + '">'
      + '<span class="spine ' + st + '"></span>'
      + '<span class="body"><span class="title">' + esc(d.item) + '</span>'
      + '<span class="meta">' + rowMeta(d, c) + '</span></span>'
      + '<span class="figs"><span class="a ' + cls + '">' + fig + '</span>'
      + '<span class="b">' + sub + '</span></span>'
      + '</button>'
      + (open ? detailHTML(d, c) : '')
      + '</div>';
  }).join('');
}

/* ======================= sync and export ======================= */
function csv(){
  var head = ['Status','Item name','Amazon link','Order date','Arrival date','Review eligible',
    'Review type','Review done?','Price','Tax charged','Refund %','Tax refunded?','Points %',
    'Refund expected','Refund received','Tax reimb. expected','Tax reimb. received','Shortfall',
    'Points value','Net cost','FB fee %','Breakeven','Sale date','Sale price','FB fees','Profit','Notes'];
  var lines = [head];
  S.deals.forEach(function(d){
    var c = calc(d);
    lines.push([
      state(d), d.item, d.link, d.orderDate, d.arrivalDate, iso(c.eligible),
      d.reviewType, d.reviewDone ? 'Yes' : 'No',
      d.price, d.tax, c.effPct, c.taxExp > 0 ? 'Yes' : 'No', c.pointsPct,
      r2(c.refundExp), d.refundGot, r2(c.taxExp), d.taxGot, c.shortfall === null ? '' : r2(c.shortfall),
      r2(c.points), r2(c.netCost), c.feePct, r2(c.breakeven),
      d.saleDate, d.salePrice, c.fees === null ? '' : r2(c.fees),
      c.profit === null ? '' : r2(c.profit), d.notes
    ]);
  });
  return lines.map(function(row){
    return row.map(function(v){
      if (v === null || v === undefined) return '';
      var s = String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\n');
}
function r2(v){ return v === null || v === undefined || isNaN(v) ? '' : Math.round(v*100)/100; }

function download(name, text, mime){
  var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

function pushToSheet(){
  var url = S.settings.sheetUrl;
  if (!url) { toast('Add the sheet address first.'); return; }
  var btn = document.getElementById('s-push');
  btn.disabled = true; btn.textContent = 'Pushing…';
  var payload = S.deals.map(function(d){
    var c = calc(d);
    return {
      status: state(d), item: d.item, link: d.link,
      orderDate: d.orderDate, arrivalDate: d.arrivalDate, eligible: iso(c.eligible),
      reviewType: d.reviewType, reviewDone: d.reviewDone ? 'Yes' : 'No',
      price: d.price, tax: d.tax, refundPct: c.effPct,
      taxRefunded: c.taxExp > 0 ? 'Yes' : 'No', pointsPct: c.pointsPct,
      refundGot: d.refundGot, taxGot: d.taxGot, feePct: c.feePct,
      saleDate: d.saleDate, salePrice: d.salePrice, notes: d.notes
    };
  });
  fetch(url, {
    method: 'POST',
    // text/plain avoids a CORS preflight that Apps Script will not answer
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ deals: payload })
  }).then(function(r){ return r.text(); })
    .then(function(){ toast('Pushed ' + payload.length + ' deal' + (payload.length===1?'':'s') + ' to the sheet.'); })
    .catch(function(){ toast('The sheet did not answer. Check the address and that it is set to allow anyone.'); })
    .then(function(){ btn.disabled = false; btn.textContent = 'Push to the sheet'; });
}

/* ======================= render ======================= */
function render(){
  var t = totals();
  document.getElementById('ledger').innerHTML =
      led(money0(t.owed), 'Owed to you', 'owed', t.owed > 0)
    + led(String(t.dueCt), t.dueCt === 1 ? 'Review due' : 'Reviews due', 'review', t.dueCt > 0)
    + led(String(t.onHand), 'In stock', 'stock', false)
    + led(money0(maaserPicture().balance), 'Maaser owed', 'maaser', false);

  document.getElementById('tabs').innerHTML = TABS.map(function(x){
    var n = S.deals.filter(x.test).length;
    return '<button role="tab" aria-selected="' + (tab === x.k) + '" data-tab="' + x.k + '">'
      + x.label + (n ? '<span class="ct">' + n + '</span>' : '') + '</button>';
  }).join('');

  document.getElementById('list').innerHTML = listHTML();
  document.getElementById('maaser').innerHTML = maaserHTML();
  var sp = document.getElementById('settings');
  if (!sp.hidden) sp.innerHTML = settingsHTML();
}
function led(v, k, goTab, flag){
  return '<div role="button" tabindex="0" data-led="' + goTab + '">'
    + '<div class="v' + (flag ? ' flag' : '') + '">' + v + '</div>'
    + '<div class="k">' + k + '</div></div>';
}

/* ======================= events ======================= */
document.getElementById('btnNew').addEventListener('click', function(){
  if (formOpen) closeForm(); else openForm(null);
});
document.getElementById('btnData').addEventListener('click', function(){
  var sp = document.getElementById('settings');
  sp.hidden = !sp.hidden;
  if (!sp.hidden) { sp.innerHTML = settingsHTML(); sp.scrollIntoView({ behavior:'smooth', block:'start' }); }
});

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-tab],[data-toggle],[data-edit],[data-del],[data-copy],[data-led],[data-delpay]');
  if (!el) return;

  if (el.dataset.tab) { tab = el.dataset.tab; render(); return; }
  if (el.dataset.led) {
    var map = { owed:'owed', review:'review', stock:'stock', maaser:null };
    if (el.dataset.led === 'maaser') {
      document.getElementById('maaser').scrollIntoView({ behavior:'smooth', block:'start' });
    } else { tab = map[el.dataset.led]; render(); }
    return;
  }
  if (el.dataset.toggle) {
    var id = el.dataset.toggle;
    openRows[id] = !openRows[id];
    render();
    return;
  }
  if (el.dataset.edit) { openForm(el.dataset.edit); window.scrollTo({ top:0, behavior:'smooth' }); return; }
  if (el.dataset.del) {
    var d = S.deals.find(function(x){ return x.id === el.dataset.del; });
    if (d && window.confirm('Delete "' + d.item + '"? This cannot be undone.')) {
      S.deals = S.deals.filter(function(x){ return x.id !== el.dataset.del; });
      save(); render(); toast('Deleted.');
    }
    return;
  }
  if (el.dataset.copy) {
    var dd = S.deals.find(function(x){ return x.id === el.dataset.copy; });
    var txt = (dd && dd.reviewText) || '';
    if (!txt) { toast('Nothing written yet.'); return; }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(txt).then(function(){ toast('Copied.'); },
        function(){ toast('Could not copy. Select it by hand.'); });
    } else { toast('Select it by hand to copy.'); }
    return;
  }
  if (el.dataset.delpay) {
    S.payments = S.payments.filter(function(p){ return p.id !== el.dataset.delpay; });
    save(); render(); return;
  }
});

/* field edits inside a row */
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.dataset && el.dataset.f) {
    var d = S.deals.find(function(x){ return x.id === el.dataset.id; });
    if (!d) return;
    var f = el.dataset.f;
    if (f === 'reviewDone' || f === 'listed' || f === 'dead') d[f] = el.value === 'yes';
    else if (f === 'refundGot' || f === 'taxGot' || f === 'salePrice') d[f] = num(el.value);
    else d[f] = el.value;
    if (f === 'salePrice' && d.salePrice !== null && !d.saleDate) d.saleDate = iso(today());
    if (f === 'reviewDone' && d.reviewDone) toast('Marked as posted.');
    save(); render();
    return;
  }
  if (el.dataset && el.dataset.s) {
    var k = el.dataset.s;
    if (k === 'pointsAsIncome') S.settings[k] = el.value === 'yes';
    else if (k === 'sheetUrl') S.settings[k] = el.value.trim();
    else if (k === 'reviewWindow') S.settings[k] = Math.max(0, parseInt(el.value, 10) || 0);
    else S.settings[k] = (num(el.value) || 0) / 100;
    save(); render();
    if (k === 'sheetUrl') document.getElementById('settings').innerHTML = settingsHTML();
  }
});
/* review draft saves as you type, without a re-render stealing focus */
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.dataset && el.dataset.f === 'reviewText') {
    var d = S.deals.find(function(x){ return x.id === el.dataset.id; });
    if (d) { d.reviewText = el.value; save(); }
  }
});

document.addEventListener('click', function(e){
  if (e.target.id === 'p-add') {
    var amt = num(document.getElementById('p-amt').value);
    if (amt === null || amt <= 0) { toast('Enter an amount.'); return; }
    S.payments.push({ id: uid(), amount: amt,
      date: document.getElementById('p-date').value || iso(today()),
      note: document.getElementById('p-note').value.trim() });
    save(); render(); toast('Recorded.');
  }
  if (e.target.id === 's-backup') {
    download('deal-desk-backup-' + iso(today()) + '.json', JSON.stringify(S, null, 2), 'application/json');
  }
  if (e.target.id === 's-csv') {
    download('deals-' + iso(today()) + '.csv', csv(), 'text/csv;charset=utf-8');
  }
  if (e.target.id === 's-push') pushToSheet();
  if (e.target.id === 's-restore') document.getElementById('s-file').click();
});

document.addEventListener('change', function(e){
  if (e.target.id !== 's-file') return;
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var incoming = JSON.parse(fr.result);
      if (!incoming || !Array.isArray(incoming.deals)) throw new Error('shape');
      if (!window.confirm('Replace what is here with ' + incoming.deals.length + ' deal(s) from the backup?')) return;
      S = incoming;
      if (!S.settings) S.settings = blank().settings;
      if (!S.payments) S.payments = [];
      save(); render(); toast('Backup restored.');
    } catch (err) { toast('That file is not a Deal Desk backup.'); }
  };
  fr.readAsText(file);
  e.target.value = '';
});

render();
</script>
</body>
</html>
